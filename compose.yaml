services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-db_qurban}
      MARIADB_USER: ${DB_USERNAME:-qurban}
      MARIADB_PASSWORD: ${DB_PASSWORD:-local-only-change-me}
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
    volumes:
      - db_data:/var/lib/mysql
      - ./db_qurban.sql:/docker-entrypoint-initdb.d/01-db_qurban.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-db_qurban}
      DB_USERNAME: ${DB_USERNAME:-qurban}
      DB_PASSWORD: ${DB_PASSWORD:-local-only-change-me}
    volumes:
      - .:/app
    working_dir: /app
    command: php -d display_errors=0 -S 0.0.0.0:8000 -t /app
    ports:
      - "${APP_PORT:-8000}:8000"

volumes:
  db_data:
